<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黑塞文学知识图谱</title>
<style>
  :root {
    --bg: #11100f; --bg2: #191716; --bg3: #26221d;
    --gold: #d4a745; --gold-dim: #a07c30;
    --blue: #5a9bd5; --blue-dim: #3a6b95;
    --red: #c0392b;
    --green: #6bbf5a;
    --purple: #9b59b6;
    --cyan: #45b39d;
    --orange: #e67e22;
    --text: #e8e0d4; --text2: #b0a898; --text3: #706858;
    --border: #2d261e;
    --nav-h: 44px;
    --side-w: clamp(210px, 18vw, 280px);
    --font: -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif;
    --serif: 'Georgia', 'Noto Serif SC', serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; min-height:100%; overflow:hidden; }
  body { font-family:var(--font); background:var(--bg); color:var(--text); }

  /* ── Top Nav ── */
  .topnav { min-height:var(--nav-h); display:grid; grid-template-columns:minmax(0, 1fr) auto; align-items:center;
    gap:10px; padding:0 max(18px, env(safe-area-inset-right)) 0 max(18px, env(safe-area-inset-left));
    background:var(--bg2); border-bottom:1px solid var(--border); flex-shrink:0; }
  .topnav > div:first-child { min-width:0; flex:0 1 auto; display:flex; align-items:center; overflow:hidden; }
  .topnav .logo { display:inline-block; min-width:0; font-family:var(--serif); font-size:0.9rem; color:var(--gold); letter-spacing:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .topnav .subtitle { font-size:0.7rem; color:var(--text3); margin-left:12px; }
  .topnav .nav-wrap { display:flex; gap:0; flex:0 0 auto; margin-left:auto; }
  .topnav .nav-btn { padding:0 clamp(10px, 1.4vw, 18px); height:var(--nav-h); line-height:var(--nav-h);
    font-size:0.8rem; color:var(--text3); cursor:pointer; border-bottom:2px solid transparent;
    transition:all .15s; background:transparent; border-top:0; border-left:0; border-right:0; font-family:var(--font); }
  .topnav .nav-btn:hover { color:var(--text2); }
  .topnav .nav-btn.active { color:var(--gold); border-bottom-color:var(--gold); }

  .app { display:flex; height:calc(100vh - var(--nav-h)); height:calc(100dvh - var(--nav-h)); min-height:0; }

  /* ── Sidebar ── */
  .sidebar { width:var(--side-w); background:var(--bg2); border-right:1px solid var(--border);
    display:flex; flex-direction:column; flex-shrink:0; overflow:hidden; }
  .sidebar .status-bar { padding:10px 14px; font-size:0.72rem; color:var(--text2);
    border-bottom:1px solid var(--border); }
  .sidebar .status-bar strong { color:var(--gold); }
  .toolbox { padding:10px; border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:8px; }
  .search-box { width:100%; height:30px; background:var(--bg); border:1px solid var(--border);
    color:var(--text); border-radius:5px; padding:0 9px; font-family:var(--font); font-size:0.76rem; outline:none; }
  .search-box:focus { border-color:var(--gold-dim); }
  .quick-actions { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .small-btn { height:28px; border:1px solid var(--border); background:var(--bg3); color:var(--text2);
    border-radius:5px; cursor:pointer; font-size:0.68rem; font-family:var(--font); }
  .small-btn:hover { border-color:var(--gold-dim); color:var(--gold); }
  .filter-group { padding:10px 10px; flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
  .filter-group .fg-head { font-size:0.68rem; color:var(--text3); letter-spacing:1px;
    padding:6px 4px; text-transform:uppercase; }
  .filter-item { display:flex; align-items:center; gap:8px; padding:6px 8px;
    border-radius:5px; cursor:pointer; font-size:0.78rem; color:var(--text3);
    transition:all .1s; user-select:none; }
  .filter-item:hover { background:var(--bg3); color:var(--text2); }
  .filter-item .d { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .filter-item .n { margin-left:auto; font-size:0.65rem; color:var(--text3); opacity:0.6; }
  .filter-item.active { color:var(--text); background:var(--bg3); }
  .filter-item.active .n { opacity:1; color:var(--text2); }
  .sidebar .foot { padding:10px 14px; font-size:0.6rem; color:var(--text3);
    border-top:1px solid var(--border); }

  /* ── Main ── */
  .main { flex:1; display:flex; position:relative; overflow:hidden; }

  /* ── Graph View ── */
  .graph-view { position:absolute; inset:0; display:flex; }
  .graph-view.hidden { display:none; }
  .graph-area { flex:1; position:relative; }
  .graph-area svg { width:100%; height:100%; display:block; }

  .node-circle { stroke-width:2; cursor:pointer; }
  .node-motif .node-circle { fill:var(--gold); stroke:var(--gold-dim); }
  .node-work .node-circle { fill:var(--blue); stroke:var(--blue-dim); }
  .node-debate .node-circle { fill:var(--red); stroke:#7a1515; }
  .node-character .node-circle { fill:var(--purple); stroke:#5a2a7a; }
  .node-structure .node-circle { fill:var(--cyan); stroke:#1a6050; }
  .node-grammar .node-circle { fill:var(--green); stroke:#3a8a2a; }
  .node-culture .node-circle { fill:var(--orange); stroke:#b85a10; }

  .node-label { font-size:9.5px; fill:var(--text2); text-anchor:middle; pointer-events:none; font-family:var(--font); }
  .link { stroke:var(--border); stroke-opacity:0.34; stroke-width:1; }
  .link.rel-evidence { stroke:var(--gold-dim); stroke-width:1.2; stroke-opacity:0.5; }
  .link.rel-debate { stroke:var(--red); stroke-opacity:0.45; }
  .link.rel-form { stroke:var(--cyan); stroke-opacity:0.45; }
  .link.rel-source { stroke:var(--orange); stroke-opacity:0.42; }
  .link-label { fill:var(--text3); font-size:7px; text-anchor:middle; pointer-events:none; opacity:0.65; transition:opacity .16s; }
  .node-dim { opacity:0.14; }
  .link-dim { stroke-opacity:0.05 !important; }
  .label-dim { opacity:0.04 !important; }
  .node-focus .node-circle { stroke:#f1d27a; stroke-width:3.5; filter:drop-shadow(0 0 7px rgba(212,167,69,0.55)); }
  .link-focus { stroke-opacity:0.82 !important; stroke-width:1.9; }
  .node-match .node-circle { stroke:#f1d27a; stroke-width:3; filter:drop-shadow(0 0 5px rgba(212,167,69,0.45)); }

  .legend { position:absolute; bottom:10px; left:10px; display:flex; gap:8px; flex-wrap:wrap;
    background:rgba(19,16,12,0.7); padding:5px 8px; border-radius:4px; }
  .legend span { display:inline-flex; align-items:center; gap:4px; font-size:0.6rem; color:var(--text3); }
  .legend .d { width:7px; height:7px; border-radius:50%; }

  /* ── Detail Panel ── */
  .panel { position:absolute; top:0; right:-420px; width:400px; height:100%;
    background:var(--bg2); border-left:1px solid var(--border);
    transition:right .25s cubic-bezier(.4,0,.2,1); z-index:20; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
  .panel.open { right:0; }
  .panel-in { padding:18px; display:flex; flex-direction:column; gap:12px; }
  .panel .close { align-self:flex-end; background:var(--bg3); border:none;
    color:var(--text3); font-size:0.85rem; width:26px; height:26px; border-radius:4px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .panel .close:hover { color:var(--text); background:var(--border); }
  .panel h2 { font-family:var(--serif); font-size:1.05rem; color:var(--gold); }
  .panel h3 { font-size:0.7rem; color:var(--text3); letter-spacing:1px; text-transform:uppercase; margin:4px 0 6px; }
  .panel .tag { display:inline-block; background:var(--bg3); color:var(--text2);
    padding:2px 9px; border-radius:5px; font-size:0.72rem; margin:2px; }
  .panel .blockquote { font-size:0.8rem; color:var(--blue); font-style:italic; line-height:1.5;
    padding:10px 12px; background:rgba(90,155,213,0.07); border-left:2px solid var(--blue-dim);
    border-radius:4px; margin:4px 0; }
  .panel p { font-size:0.8rem; line-height:1.6; color:var(--text2); }
  .panel .tags { display:flex; flex-wrap:wrap; gap:3px; }
  .panel .evidence { border:1px solid var(--border); border-radius:6px; padding:9px 11px; background:rgba(255,255,255,0.015); }
  .panel .evidence strong { display:block; color:var(--text); font-size:0.76rem; margin-bottom:3px; }
  .panel .evidence span { display:block; color:var(--text3); font-size:0.68rem; line-height:1.45; }

  .panel .db-box { border:1px solid var(--border); border-radius:6px; padding:10px 12px; margin-top:4px; }
  .panel .db-box .side { padding:5px 0 5px 10px; font-size:0.78rem; }
  .panel .db-box .side.pro { border-left:3px solid var(--red); color:var(--text2); }
  .panel .db-box .side.con { border-left:3px solid var(--blue); color:var(--text2); }

  /* ── Timeline View ── */
  .timeline-view { position:absolute; inset:0; display:none; flex-direction:column; min-height:0; overflow:hidden; }
  .timeline-view.active { display:flex; }

  .tl-chart { flex:1 1 auto; min-height:0; position:relative; overflow:hidden; }
  .tl-chart svg { width:100%; height:100%; display:block; }
  .tl-card { cursor:pointer; }
  .tl-card rect { fill:rgba(25,23,22,0.94); stroke:var(--border); stroke-width:1; rx:7; }
  .tl-card:hover rect, .tl-card.active rect { stroke:var(--gold-dim); fill:rgba(38,34,29,0.98); }
  .tl-card .year { fill:var(--gold); font-size:10px; font-family:var(--font); font-weight:600; }
  .tl-card .title { fill:var(--text); font-size:12px; font-family:var(--serif); }
  .tl-card .desc { fill:var(--text3); font-size:9px; font-family:var(--font); }
  .tl-card .motif { fill:var(--text2); font-size:8px; font-family:var(--font); }
  .tl-era { fill:rgba(90,155,213,0.045); stroke:rgba(212,167,69,0.08); }
  .tl-era-label { fill:var(--text3); font-size:10px; letter-spacing:.5px; font-family:var(--font); }
  .tl-mobile-list { height:100%; min-height:0; overflow:auto; padding:12px; display:grid; gap:10px;
    -webkit-overflow-scrolling:touch; overscroll-behavior:contain; touch-action:pan-y; }
  .tl-mobile-card { border:1px solid var(--border); border-radius:7px; background:var(--bg2);
    padding:11px 12px; display:grid; grid-template-columns:54px 1fr; gap:10px; cursor:pointer; }
  .tl-mobile-card.active { border-color:var(--gold-dim); background:var(--bg3); }
  .tl-mobile-card .y { color:var(--gold); font-size:0.82rem; font-weight:600; }
  .tl-mobile-card .t { color:var(--text); font-family:var(--serif); font-size:0.92rem; }
  .tl-mobile-card .d { color:var(--text3); font-size:0.72rem; line-height:1.4; margin-top:2px; }
  .tl-info { height:80px; flex-shrink:0; background:var(--bg2); border-top:1px solid var(--border);
    padding:12px 20px; display:flex; flex-direction:column; justify-content:center; }
  .tl-info .tl-title { font-family:var(--serif); font-size:1rem; color:var(--text); }
  .tl-info .tl-desc { font-size:0.8rem; color:var(--text3); margin-top:2px; }
  .tl-info .tl-tags { display:flex; gap:4px; margin-top:4px; }
  .tl-info .tl-tags span { background:var(--bg3); padding:1px 8px; border-radius:4px; font-size:0.65rem; color:var(--text2); }

  .tl-axis line { stroke:var(--border); }
  .tl-axis text { fill:var(--text3); font-size:8px; font-family:var(--font); }
  .tl-dot { cursor:pointer; }
  .tl-dot circle { stroke-width:2; }
	  .tl-dot text { fill:var(--text2); font-size:8px; text-anchor:middle; font-family:var(--font); pointer-events:none; }

  /* ── Image2 View ── */
  .image-view { position:absolute; inset:0; display:none; overflow:hidden; }
  .image-view.active { display:grid; grid-template-columns:minmax(320px, 42%) 1fr; }
  .image-stage { border-right:1px solid var(--border); background:var(--bg); display:flex; flex-direction:column; min-width:0; }
  .image-drop { margin:14px; min-height:220px; border:1px dashed var(--border); border-radius:8px;
    display:flex; align-items:center; justify-content:center; position:relative; background:rgba(255,255,255,0.015); overflow:hidden; }
  .image-drop.drag { border-color:var(--gold); background:rgba(212,167,69,0.07); }
  .image-drop input { position:absolute; inset:0; opacity:0; cursor:pointer; }
  .drop-copy { text-align:center; color:var(--text3); font-size:0.78rem; line-height:1.6; padding:18px; }
  .drop-copy strong { color:var(--gold); font-family:var(--serif); font-size:1rem; font-weight:400; }
  #imageCanvas { width:100%; height:100%; display:none; object-fit:contain; }
  .image-metrics { padding:0 14px 14px; display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .metric { border:1px solid var(--border); border-radius:6px; padding:8px; background:var(--bg2); }
  .metric .k { color:var(--text3); font-size:0.62rem; letter-spacing:.5px; text-transform:uppercase; }
  .metric .v { color:var(--text); font-size:0.95rem; margin-top:2px; }
  .image-results { overflow:auto; min-height:0; padding:14px; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; touch-action:pan-y; }
  .image-results h2 { font-family:var(--serif); color:var(--gold); font-size:1.05rem; margin-bottom:10px; }
  .result-row { border:1px solid var(--border); border-radius:7px; padding:10px 12px; margin-bottom:8px; background:var(--bg2); }
  .result-row .top { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .result-row .name { color:var(--text); font-size:0.84rem; }
  .result-row .score { color:var(--gold); font-size:0.78rem; }
  .bar { height:4px; background:var(--bg3); border-radius:4px; overflow:hidden; margin:8px 0; }
  .bar span { display:block; height:100%; background:var(--gold); border-radius:4px; }
  .reason { color:var(--text3); font-size:0.72rem; line-height:1.45; }
  .swatches { display:flex; gap:5px; margin:0 14px 14px; }
  .swatches span { width:22px; height:22px; border-radius:5px; border:1px solid var(--border); }

  /* ── scroll ── */
	  ::-webkit-scrollbar { width:5px; }
	  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

  @media (min-width: 1440px) {
    .node-label { font-size:10.5px; }
    .panel { width:440px; right:-460px; }
    .tl-info { height:92px; }
  }

  @media (max-width: 1024px) {
    :root { --side-w: 200px; }
    .topnav .subtitle { display:none; }
    .image-view.active { grid-template-columns:minmax(300px, 44%) 1fr; }
  }

  @media (max-width: 820px) {
    :root { --nav-h: 42px; }
    html, body { width:100%; max-width:100vw; overflow:hidden; }
    .topnav { position:relative; display:block; width:100vw; max-width:100vw; padding:0 max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left)); }
    .topnav > div:first-child { display:none; }
    .topnav .subtitle { display:none; }
    .topnav .logo { max-width:124px; font-size:0.82rem; letter-spacing:.2px; }
    .topnav .nav-wrap { position:absolute; inset:0 max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left));
      width:auto; max-width:none; display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); }
    .topnav .nav-btn { padding:0 6px; font-size:0.72rem; min-width:0; }
    .app { flex-direction:column; width:100vw; max-width:100vw; overflow:hidden; }
    .sidebar { width:100%; height:auto; max-height:154px; border-right:0; border-bottom:1px solid var(--border); }
    .sidebar .status-bar { padding:7px 10px; }
    .toolbox { padding:8px 10px; display:grid; grid-template-columns:minmax(120px,1fr) 144px; gap:7px; }
    .search-box { height:32px; }
    .quick-actions { gap:5px; }
    .small-btn { height:32px; }
    .filter-group { display:flex; overflow:auto; flex:none; padding:8px 10px; gap:6px; touch-action:pan-x; }
    .filter-group .fg-head { display:none; }
    .filter-item { flex:0 0 auto; padding:7px 9px; white-space:nowrap; }
    .sidebar .foot { display:none; }
    .main { min-height:0; }
    .legend { left:8px; right:8px; bottom:8px; max-height:42px; overflow:hidden; }
    .panel { top:auto; right:0; bottom:-60%; width:100%; height:min(58%, 430px); border-left:0; border-top:1px solid var(--border);
      transition:bottom .25s cubic-bezier(.4,0,.2,1); }
    .panel.open { right:0; bottom:0; }
    .panel-in { padding:12px 14px max(14px, env(safe-area-inset-bottom)); gap:9px; }
    .image-view.active { grid-template-columns:1fr; grid-template-rows:45% 55%; }
    .image-stage { border-right:0; border-bottom:1px solid var(--border); }
    .image-drop { margin:10px; min-height:150px; }
    .image-metrics { padding:0 10px 10px; gap:6px; }
    .metric { padding:7px; }
    .image-results { padding:10px; }
  }

  @media (max-width: 520px) {
    :root { --nav-h: 40px; }
    .topnav { gap:0; }
    .topnav .logo { max-width:118px; overflow:hidden; text-overflow:ellipsis; }
    .topnav .nav-btn { padding:0 7px; min-width:42px; font-size:0.68rem; }
    .sidebar { max-height:166px; }
    .toolbox { grid-template-columns:1fr; gap:6px; }
    .filter-group { padding-top:6px; }
    .filter-item .n { display:none; }
    .node-label { font-size:8px; }
    .legend { display:none; }
    .tl-info { height:96px; padding:10px 12px max(10px, env(safe-area-inset-bottom)); }
    .tl-info .tl-tags { flex-wrap:wrap; max-height:38px; overflow:hidden; }
    .image-view.active { grid-template-rows:42% 58%; }
    .result-row { padding:9px; }
  }

  @media (max-width: 390px) {
    .topnav .logo { max-width:96px; }
    .topnav .nav-btn { min-width:38px; padding:0 5px; }
    .sidebar { max-height:158px; }
    .filter-item { font-size:0.72rem; padding:6px 8px; }
  }

  @media (orientation: landscape) and (max-height: 520px) and (max-width: 940px) {
    .app { flex-direction:row; }
    .sidebar { width:190px; height:100%; max-height:none; border-right:1px solid var(--border); border-bottom:0; }
    .toolbox { display:flex; padding:8px; }
    .filter-group { display:block; overflow:auto; padding:8px; }
    .filter-item .n { display:inline; }
    .panel { top:0; right:-360px; bottom:auto; width:min(360px, 45vw); height:100%; border-left:1px solid var(--border); border-top:0; transition:right .25s cubic-bezier(.4,0,.2,1); }
    .panel.open { right:0; bottom:auto; }
    .image-view.active { grid-template-columns:minmax(260px, 42%) 1fr; grid-template-rows:none; }
  }
</style>
</head>
<body>

<div class="topnav">
	  <div><span class="logo">黑塞文学·知识图谱</span><span class="subtitle">十一部小说 · 母题证据 · Image2</span></div>
	  <div class="nav-wrap">
	    <button class="nav-btn active" data-view="graph">网络</button>
	    <button class="nav-btn" data-view="timeline">时间线</button>
	    <button class="nav-btn" data-view="image">Image2</button>
	  </div>
	</div>

<div class="app">
  <!-- Sidebar -->
	  <div class="sidebar">
	    <div class="status-bar">已显示 <strong id="layerCount">7</strong>/7 层</div>
	    <div class="toolbox">
	      <input class="search-box" id="searchBox" type="search" placeholder="检索作品、母题、证据">
	      <div class="quick-actions">
	        <button class="small-btn" id="focusCore">核心母题</button>
	        <button class="small-btn" id="resetGraph">重置</button>
	      </div>
	    </div>
	    <div class="filter-group" id="filterGroup"></div>
	    <div class="foot">方案A · GitHub Pages · 2026</div>
	  </div>

  <!-- Main -->
  <div class="main">
    <!-- Graph -->
    <div class="graph-view" id="graphView">
      <div class="graph-area" id="graphArea">
        <div class="legend" id="legend"></div>
        <div class="panel" id="detailPanel"><div class="panel-in" id="panelInner"></div></div>
      </div>
    </div>

    <!-- Timeline -->
	    <div class="timeline-view" id="timelineView">
	      <div class="tl-chart" id="tlChart"></div>
	      <div class="tl-info" id="tlInfo">
	        <div class="tl-title">点击作品查看</div>
	        <div class="tl-desc">1904–1943 · 十一部主要小说</div>
	      </div>
	    </div>

	    <!-- Image2 -->
	    <div class="image-view" id="imageView">
	      <div class="image-stage">
	        <div class="image-drop" id="imageDrop">
	          <input id="imageInput" type="file" accept="image/*">
	          <canvas id="imageCanvas"></canvas>
	          <div class="drop-copy" id="dropCopy">
	            <strong>Image2 Motif</strong><br>
	            本地图像进入黑塞母题网络
	          </div>
	        </div>
	        <div class="swatches" id="swatches"></div>
	        <div class="image-metrics">
	          <div class="metric"><div class="k">Light</div><div class="v" id="mLight">--</div></div>
	          <div class="metric"><div class="k">Warmth</div><div class="v" id="mWarm">--</div></div>
	          <div class="metric"><div class="k">Texture</div><div class="v" id="mTexture">--</div></div>
	        </div>
	      </div>

// GRAPH

let sim, svgG, linkG, nodeG, labelG;
let selectedNodeId = null;
const nodeR = {motif:15, work:11, debate:9, character:10, structure:10, grammar:9, culture:9};

	function getActiveNodes() {
	  const r = []; const s = new Set();
	  const q = activeQuery.trim().toLowerCase();
	  const allowedByFocus = new Set();
	  if(focusCoreOnly) {
	    coreMotifs.forEach(id => allowedByFocus.add(id));
	    semanticEdges.forEach(ed => {
	      if(coreMotifs.has(ed.s)) allowedByFocus.add(ed.t);
	      if(coreMotifs.has(ed.t)) allowedByFocus.add(ed.s);
	    });
	  }
	  layers.forEach(l => {
	    if(!l.show) return;
	    l.data.forEach(d => {
	      if(focusCoreOnly && !allowedByFocus.has(d.id)) return;
	      const hay = [d.name,d.de,d.desc,d.quote,d.pro,d.con,(d.evidence||[]).join(' ')].filter(Boolean).join(' ').toLowerCase();
	      if(!s.has(d.id)) { s.add(d.id); r.push({...d, _ly: l.key, _match: q ? hay.includes(q) : false}); }
	    });
	  });
	  return r;
	}
	
	function getActiveEdges(nodes) {
	  const ids = new Set(nodes.map(n=>n.id));
	  return semanticEdges
	    .filter(ed=>ids.has(ed.s)&&ids.has(ed.t))
	    .map(ed=>({...ed, source:ed.s, target:ed.t}));
	}

function rebuildGraph() {
  const area = document.getElementById('graphArea');
  area.querySelectorAll('svg').forEach(s=>s.remove());

  const W = Math.max(area.clientWidth, 600), H = Math.max(area.clientHeight, 400);
  const nodes = getActiveNodes();
  const links = getActiveEdges(nodes);
  if(selectedNodeId && !nodes.some(n=>n.id===selectedNodeId)) selectedNodeId = null;

  const svg = d3.select(area).insert('svg','.panel').attr('viewBox',[0,0,W,H])
    .style('width','100%').style('height','100%');

	  sim = d3.forceSimulation(nodes)
	    .force('link', d3.forceLink(links).id(d=>d.id).distance(d=>82 / (d.weight || 1)).strength(d=>0.28 * (d.weight || 1)))
	    .force('charge', d3.forceManyBody().strength(-260))
	    .force('center', d3.forceCenter(W/2, H/2))
	    .force('collision', d3.forceCollide().radius(30));

  linkG = svg.append('g');
  nodeG = svg.append('g');

	  linkG.selectAll('line').data(links).join('line').attr('class',d=>`link rel-${d.rel}`);
	  labelG = svg.append('g');
	  labelG.selectAll('text').data(links.filter(d=>d.weight>=1.1)).join('text')
	    .attr('class','link-label').text(d=>d.label);

	  const g = nodeG.selectAll('g').data(nodes).join('g')
	    .attr('class',d=>`node-${d._ly}${d._match?' node-match':''}`)
	    .attr('data-node-id',d=>d.id)
    .call(d3.drag()
      .clickDistance(5)
      .on('start',(e,d)=>{if(!e.active)sim.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y;})
      .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y;})
      .on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}))
    .on('click',(e,d)=>{ e.stopPropagation(); setGraphFocus(d.id); openPanel(d); });

  g.append('circle').attr('class','node-circle').attr('r',d=>nodeR[d._ly]||10);
  g.append('text').attr('class','node-label')
    .text(d=>d.name.length>7?d.name.slice(0,7)+'…':d.name)
    .attr('dy',d=>-nodeR[d._ly]-5);

	  sim.on('tick', ()=>{
	    nodes.forEach(d=>{
	      const r = (nodeR[d._ly] || 10) + 12;
	      d.x = Math.max(r, Math.min(W-r, d.x));
	      d.y = Math.max(r, Math.min(H-r, d.y));
	    });
	    linkG.selectAll('line')
	      .attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
	      .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
	    labelG.selectAll('text')
	      .attr('x',d=>(d.source.x+d.target.x)/2)
	      .attr('y',d=>(d.source.y+d.target.y)/2);
	    nodeG.selectAll('g').attr('transform',d=>`translate(${d.x},${d.y})`);
	  });

  updateGraphFocus();
  svg.on('click', ()=>{ clearGraphFocus(); closePanel(false); });
}

function linkTouchesNode(d, id) {
  const sid = typeof d.source === 'object' ? d.source.id : d.source;
  const tid = typeof d.target === 'object' ? d.target.id : d.target;
  return sid===id || tid===id;
}
function focusedNodeIds(id) {
  const ids = new Set([id]);
  if(!id) return ids;
  const linkData = linkG ? linkG.selectAll('line').data() : [];
  linkData.forEach(d=>{
    const sid = typeof d.source === 'object' ? d.source.id : d.source;
    const tid = typeof d.target === 'object' ? d.target.id : d.target;
    if(sid===id) ids.add(tid);
    if(tid===id) ids.add(sid);
  });
  return ids;
}
function setGraphFocus(id) {
  selectedNodeId = id;
  updateGraphFocus();
}
function clearGraphFocus() {
  selectedNodeId = null;
  updateGraphFocus();
}
function updateGraphFocus() {
  if(!nodeG || !linkG || !labelG) return;
  const ids = focusedNodeIds(selectedNodeId);
  nodeG.selectAll('g')
    .classed('node-dim', d=>!!selectedNodeId && !ids.has(d.id))
    .classed('node-focus', d=>!!selectedNodeId && d.id===selectedNodeId);
  linkG.selectAll('line')
    .classed('link-dim', d=>!!selectedNodeId && !linkTouchesNode(d, selectedNodeId))
    .classed('link-focus', d=>!!selectedNodeId && linkTouchesNode(d, selectedNodeId));
  labelG.selectAll('text')
    .classed('label-dim', d=>!!selectedNodeId && !linkTouchesNode(d, selectedNodeId));
}

	let panelOpen = false;
	const panelEl = document.getElementById('detailPanel');
	const panelIn = document.getElementById('panelInner');
	function relatedEdges(id) {
	  return semanticEdges
	    .filter(ed => ed.s===id || ed.t===id)
	    .map(ed => ({...ed, other: nodeIndex.get(ed.s===id ? ed.t : ed.s)}))
	    .filter(ed => ed.other);
	}
	function relationHtml(d) {
	  const rel = relatedEdges(d.id).slice(0,12);
	  if(!rel.length) return '';
	  return `<h3>关系证据</h3><div class="tags">${rel.map(ed=>`<span class="tag">${ed.label}: ${ed.other.name}</span>`).join('')}</div>`;
	}

function openPanel(d) {
  panelIn.innerHTML = '<button class="close" onclick="closePanel()">✕</button>';
  const ly = d._ly;
  let h = '';
	  if(ly==='motif') {
	    h += `<h2>Ⓣ ${d.name}</h2><span class="tag">${d.de}</span><p>${d.desc}</p>`;
	    if(d.quote) h += `<div class="blockquote">${d.quote}</div>`;
	    if(d.evidence) h += `<h3>证据链</h3>${d.evidence.map(x=>`<div class="evidence"><strong>${d.name}</strong><span>${x}</span></div>`).join('')}`;
	    if(d.works) {
      h += `<h3>关联作品</h3><div class="tags">`;
      d.works.forEach(wid=>{
        const w = works.find(ww=>ww.id===wid);
        if(w) h += `<span class="tag">${w.name}</span>`;
      });
      h += `</div>`;
    }
    const rl = debates.filter(db=>db.motif===d.id);
    if(rl.length) {
      h += `<h3>关联辩论</h3>`;
      rl.forEach(db=>{h+=`<div class="db-box"><strong>${db.name}</strong>
        <div class="side pro">正方: ${db.pro}</div>
        <div class="side con">反方: ${db.con}</div></div>`;});
    }
  } else if(ly==='work') {
    h += `<h2>Ⓦ ${d.name}</h2><span class="tag">${d.year}</span><p>${d.desc}</p>`;
    const rl = motifs.filter(m=>m.works&&m.works.includes(d.id));
    if(rl.length) {
      h += `<h3>关联母题</h3><div class="tags">`;
      rl.forEach(m=>h+=`<span class="tag">${m.name}</span>`);
      h += `</div>`;
    }
  } else if(ly==='debate') {
    h += `<h2>Ⓓ ${d.name}</h2>
      <div class="db-box">
        <div class="side pro"><strong>正方</strong><br>${d.pro}</div>
        <div class="side con"><strong>反方</strong><br>${d.con}</div>
      </div>`;
    const m = motifs.find(mt=>mt.id===d.motif);
    if(m) h += `<p>关联母题: ${m.name}</p>`;
  } else if(ly==='character') {
    h += `<h2>Ⓒ ${d.name}</h2>`;
    if(d.de) h += `<span class="tag">${d.de}</span>`;
    h += `<p>${d.desc}</p>`;
  } else if(ly==='structure') {
    h += `<h2>Ⓢ ${d.name}</h2><p>${d.desc}</p>`;
  } else if(ly==='grammar') {
    h += `<h2>Ⓖ ${d.name}</h2><p>${d.desc}</p>`;
	  } else if(ly==='culture') {
	    h += `<h2>Ⓑ ${d.name}</h2><p>${d.desc}</p>`;
	  }
	  h += relationHtml(d);
	  panelIn.innerHTML += h;
  if(!panelOpen) { panelOpen=true; panelEl.classList.add('open'); }
}
function closePanel(clearFocus=true) {
  if(clearFocus) clearGraphFocus();
  panelOpen=false; panelEl.classList.remove('open');
}

function buildTimeline(sel) {
  // cache timeline nodes
  const tw = works.slice().sort((a,b)=>a.year-b.year);
  // store on element so we can re-render
  sel._tw = tw;
  renderTimeline(sel);
}

function renderTimeline(sel) {
  const rect = sel.getBoundingClientRect();
  if(rect.width < 620) {
    renderTimelineList(sel);
    return;
  }
  const W = Math.max(rect.width, 760), H = Math.max(rect.height, 420);
  sel.innerHTML = '';
  const svg = d3.select(sel).append('svg').attr('viewBox',[0,0,W,H])
    .style('width','100%').style('height','100%');

  const tw = sel._tw || [];
  const padL = 86, padR = 86, axisY = H*0.52;
  const cardW = Math.min(158, Math.max(128, W/8.4));
  const cardH = 70;
  const laneYs = [Math.max(32, axisY-194), Math.max(108, axisY-104), Math.min(H-cardH-110, axisY+44), Math.min(H-cardH-20, axisY+134)];
  const xScale = d3.scaleLinear().domain([1903.5,1944.5]).range([padL, W-padR]);
  const g = svg.append('g');
  const info = document.getElementById('tlInfo');

  const eras = [
    {from:1904,to:1914,label:'早期: 自然、教育、艺术困境'},
    {from:1919,to:1922,label:'战后转向: 个体化与东方经验'},
    {from:1927,to:1932,label:'成熟期: 危机、艺术、共同体'},
    {from:1943,to:1943,label:'晚期: 卡斯塔里亚与精神制度'}
  ];
  g.selectAll('.tl-era').data(eras).join('rect')
    .attr('class','tl-era')
    .attr('x',d=>xScale(d.from)-12)
    .attr('y',18)
    .attr('width',d=>Math.max(44, xScale(d.to)-xScale(d.from)+24))
    .attr('height',H-42)
    .attr('rx',8);
  g.selectAll('.tl-era-label').data(eras).join('text')
    .attr('class','tl-era-label')
    .attr('x',d=>xScale(d.from))
    .attr('y',34)
    .text(d=>d.label);

  g.append('line').attr('x1',padL).attr('y1',axisY).attr('x2',W-padR).attr('y2',axisY)
    .attr('stroke','var(--border)').attr('stroke-width',2);

  const years = [1904,1906,1910,1914,1919,1922,1927,1930,1932,1943];
  g.selectAll('.tick').data(years).join('g')
    .attr('transform',d=>`translate(${xScale(d)},${axisY})`)
    .call(g=>g.append('line').attr('y1',-8).attr('y2',8).attr('stroke','var(--border)'))
    .call(g=>g.append('text').text(d=>d).attr('y',24)
      .attr('text-anchor','middle').style('fill','var(--text3)').style('font-size','10px'));

  const laneLastX = Array(laneYs.length).fill(-Infinity);
  const laid = tw.map((d,i)=>{
    const x = xScale(d.year);
    const preferred = i % laneYs.length;
    const order = [preferred, (preferred+1)%4, (preferred+2)%4, (preferred+3)%4];
    const lane = order.find(l=>x-laneLastX[l] > cardW+12) ?? preferred;
    laneLastX[lane] = x;
    return {...d, _x:x, _lane:lane, _cardX:Math.max(10, Math.min(W-cardW-10, x-cardW/2)), _cardY:laneYs[lane]};
  });

  g.selectAll('.connector').data(laid).join('path')
    .attr('d',d=>{
      const cx = d._cardX + cardW/2;
      const cy = d._cardY > axisY ? d._cardY : d._cardY + cardH;
      return `M${d._x},${axisY} L${cx},${cy}`;
    })
    .attr('stroke','rgba(212,167,69,0.35)').attr('stroke-width',1).attr('fill','none');

  g.selectAll('.tl-work-dot').data(laid).join('circle')
    .attr('class','tl-work-dot')
    .attr('cx',d=>d._x).attr('cy',axisY).attr('r',5)
    .attr('fill','var(--blue)').attr('stroke','var(--gold-dim)').attr('stroke-width',1.4);

  const card = g.selectAll('.tl-card').data(laid).join('g')
    .attr('class','tl-card')
    .attr('transform',d=>`translate(${d._cardX},${d._cardY})`)
    .on('click',(e,d)=>{
      const rl = motifs.filter(m=>m.works&&m.works.includes(d.id));
      info.innerHTML = `<div class="tl-title">Ⓦ ${d.name} (${d.year})</div>
        <div class="tl-desc">${d.desc}</div>
        <div class="tl-tags">${rl.map(m=>`<span>${m.name}</span>`).join('')}</div>`;
      card.classed('active',c=>c.id===d.id);
    });

  card.append('rect').attr('width',cardW).attr('height',cardH);
  card.append('text').attr('class','year').attr('x',12).attr('y',18).text(d=>d.year);
  card.append('text').attr('class','title').attr('x',12).attr('y',38)
    .text(d=>d.name.length>19 ? d.name.slice(0,18)+'…' : d.name);
  card.append('text').attr('class','desc').attr('x',12).attr('y',55)
    .text(d=>d.desc.length>22 ? d.desc.slice(0,21)+'…' : d.desc);
  card.append('text').attr('class','motif').attr('x',12).attr('y',67)
    .text(d=>{
      const rl = motifs.filter(m=>m.works&&m.works.includes(d.id)).map(m=>m.name);
      return rl.slice(0,2).join(' · ');
    });

  card.attr('opacity',1);
}

function renderTimelineList(sel) {
  const tw = sel._tw || [];
  sel.innerHTML = '<div class="tl-mobile-list"></div>';
  const list = sel.querySelector('.tl-mobile-list');
  const info = document.getElementById('tlInfo');
  tw.forEach(d=>{
    const el = document.createElement('div');
    el.className = 'tl-mobile-card';
    el.innerHTML = `<div class="y">${d.year}</div><div><div class="t">${d.name}</div><div class="d">${d.desc}</div></div>`;
    el.addEventListener('click',()=>{
      list.querySelectorAll('.tl-mobile-card').forEach(x=>x.classList.remove('active'));
      el.classList.add('active');
      const rl = motifs.filter(m=>m.works&&m.works.includes(d.id));
      info.innerHTML = `<div class="tl-title">Ⓦ ${d.name} (${d.year})</div>
        <div class="tl-desc">${d.desc}</div>
        <div class="tl-tags">${rl.map(m=>`<span>${m.name}</span>`).join('')}</div>`;
    });
    list.appendChild(el);
  });
}

	document.querySelectorAll('.nav-btn').forEach(btn=>{
	  btn.addEventListener('click',()=>{

	function setView(v, pushHash=false) {
	  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
	  document.getElementById('graphView').classList.toggle('hidden', v!=='graph');

	// ═══════════════════════════════════════════
	// IMAGE2: local image -> motif ranking
	// ═══════════════════════════════════════════
	const imageInput = document.getElementById('imageInput');
	const imageDrop = document.getElementById('imageDrop');
	const imageCanvas = document.getElementById('imageCanvas');
	const dropCopy = document.getElementById('dropCopy');
	const imageResults = document.getElementById('imageResults');
	const swatchesEl = document.getElementById('swatches');
	const metricEls = {
	  light: document.getElementById('mLight'),
	  warm: document.getElementById('mWarm'),
	  texture: document.getElementById('mTexture')
	};

	function clamp01(v) { return Math.max(0, Math.min(1, v)); }
	function pct(v) { return `${Math.round(clamp01(v)*100)}%`; }
	function switchToGraphFor(id) {
	  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.view==='graph'));
	  document.getElementById('graphView').classList.remove('hidden');
	  document.getElementById('timelineView').classList.remove('active');
	  document.getElementById('imageView').classList.remove('active');
	  const d = nodeIndex.get(id);
	  if(!d) return;
	  activeQuery = d.name;
	  document.getElementById('searchBox').value = d.name;
	  selectedNodeId = id;
	  rebuildGraph();
	  openPanel(d);
	}
	function dominantSwatches(samples) {
	  const buckets = new Map();
	  samples.forEach(([r,g,b])=>{
	    const key = `${Math.round(r/48)*48},${Math.round(g/48)*48},${Math.round(b/48)*48}`;
	    buckets.set(key, (buckets.get(key)||0)+1);
	  });
	  return [...buckets.entries()].sort((a,b)=>b[1]-a[1]).slice(0,6).map(([key])=>`rgb(${key})`);
	}
	function analyzePixels(ctx,w,h) {
	  const data = ctx.getImageData(0,0,w,h).data;
	  let light=0, warm=0, cool=0, green=0, sat=0, red=0, blue=0, dark=0, edge=0;
	  const samples = [];
	  const step = 4;
	  for(let y=0; y<h; y+=step) {
	    for(let x=0; x<w; x+=step) {
	      const i = (y*w+x)*4;
	      const r=data[i], g=data[i+1], b=data[i+2];
	      const max=Math.max(r,g,b), min=Math.min(r,g,b);
	      const lum=(0.2126*r+0.7152*g+0.0722*b)/255;
	      light += lum;
	      warm += Math.max(0, r-b)/255;
	      cool += Math.max(0, b-r)/255;
	      green += Math.max(0, g-Math.max(r,b)*0.82)/255;
	      red += Math.max(0, r-Math.max(g,b)*0.82)/255;
	      blue += Math.max(0, b-Math.max(r,g)*0.82)/255;
	      sat += (max-min)/255;
	      dark += lum < .28 ? 1 : 0;
	      if(x+step<w && y+step<h) {
	        const j = (y*w+x+step)*4;
	        const k = ((y+step)*w+x)*4;
	        edge += (Math.abs(r-data[j])+Math.abs(g-data[j+1])+Math.abs(b-data[j+2])+Math.abs(r-data[k])+Math.abs(g-data[k+1])+Math.abs(b-data[k+2]))/(255*6);
	      }
	      samples.push([r,g,b]);
	    }
	  }
	  const n = Math.max(1, samples.length);
	  return {
	    light: light/n, warm: warm/n, cool: cool/n, green: green/n, saturation: sat/n,
	    red: red/n, blue: blue/n, dark: dark/n, texture: edge/n, swatches: dominantSwatches(samples)
	  };
	}
	function scoreImageMotifs(m) {
	  const scores = [
	    {id:'t02', score:.18 + m.blue*.95 + m.cool*.55 + m.texture*.22, reason:'冷色、流动感和边界纹理指向河流、渡口与阈限。'},
	    {id:'t10', score:.16 + m.green*1.15 + m.texture*.35 + (1-m.saturation)*.12, reason:'绿色、自然纹理和低人工感指向山林、乡土与文明外部。'},
	    {id:'t09', score:.15 + m.saturation*.72 + m.warm*.45 + m.red*.38, reason:'高饱和与暖色张力更接近音乐、雕塑和形式化救赎。'},
	    {id:'t07', score:.14 + m.dark*.48 + m.cool*.28 + m.saturation*.26, reason:'暗部、冷色和戏剧化色彩把图像推向幻象、Maya与魔法剧场。'},
	    {id:'t05', score:.12 + m.light*.38 + m.texture*.42 + Math.abs(m.warm-m.cool)*.2, reason:'明暗推进和纹理变化对应台阶、越界和持续转化。'},
	    {id:'t08', score:.13 + m.dark*.45 + (1-m.saturation)*.32 + (1-m.light)*.2, reason:'低亮度、低饱和与空旷感指向孤独和个体化。'},
	    {id:'t06', score:.11 + m.warm*.55 + m.red*.5 + m.dark*.2, reason:'暖红与暗部组合更靠近母亲原型、欲望和吞噬性。'},
	    {id:'t04', score:.1 + m.texture*.55 + m.dark*.25 + (1-m.light)*.18, reason:'粗糙纹理与阴影容易落到死鸟、歌声沉默和凝固艺术。'},
	    {id:'t03', score:.1 + m.light*.5 + (1-m.texture)*.2 + m.warm*.16, reason:'明亮、平滑和温和色温对应超越者的静观微笑。'},
	    {id:'t01', score:.1 + (1-Math.abs(m.warm-m.cool))*.2 + m.texture*.16, reason:'冷暖平衡与双重结构可映射到朋友对子和镜像关系。'}
	  ];
	  const max = Math.max(...scores.map(s=>s.score));
	  return scores.map(s=>({...s, score:clamp01(s.score/max)})).sort((a,b)=>b.score-a.score).slice(0,6);
	}
	function renderImageResults(metrics) {
	  metricEls.light.textContent = pct(metrics.light);
	  metricEls.warm.textContent = pct((metrics.warm + 1 - metrics.cool) / 2);
	  metricEls.texture.textContent = pct(metrics.texture * 3);
	  swatchesEl.innerHTML = metrics.swatches.map(c=>`<span style="background:${c}"></span>`).join('');
	  const ranked = scoreImageMotifs(metrics);
	  imageResults.innerHTML = `<h2>视觉母题映射</h2>${ranked.map(r=>{
	    const motif = nodeIndex.get(r.id);
	    const workNames = (motif.works||[]).map(id=>nodeIndex.get(id)?.name).filter(Boolean).slice(0,3).join(' · ');
	    return `<div class="result-row" data-node="${r.id}">
	      <div class="top"><span class="name">${motif.name}</span><span class="score">${pct(r.score)}</span></div>
	      <div class="bar"><span style="width:${pct(r.score)}"></span></div>
	      <div class="reason">${r.reason}${workNames ? ` 关联作品: ${workNames}` : ''}</div>
	    </div>`;
	  }).join('')}`;
	  imageResults.querySelectorAll('.result-row[data-node]').forEach(row=>{
	    row.addEventListener('click',()=>switchToGraphFor(row.dataset.node));
	  });
	}
	function loadImageFile(file) {
	  if(!file || !file.type.startsWith('image/')) return;
	  const reader = new FileReader();
	  reader.onload = () => {
	    const img = new Image();
	    img.onload = () => {
	      const max = 720;
	      const scale = Math.min(max/img.width, max/img.height, 1);
	      const w = Math.max(1, Math.round(img.width*scale));
	      const h = Math.max(1, Math.round(img.height*scale));
	      imageCanvas.width = w; imageCanvas.height = h;
	      imageCanvas.style.display = 'block';
	      dropCopy.style.display = 'none';
	      const ctx = imageCanvas.getContext('2d', {willReadFrequently:true});
	      ctx.clearRect(0,0,w,h);
	      ctx.drawImage(img,0,0,w,h);
	      renderImageResults(analyzePixels(ctx,w,h));
	    };
	    img.src = reader.result;
	  };
	  reader.readAsDataURL(file);
	}
	imageInput.addEventListener('change', e=>loadImageFile(e.target.files[0]));
	['dragenter','dragover'].forEach(ev=>imageDrop.addEventListener(ev,e=>{e.preventDefault();imageDrop.classList.add('drag');}));
	['dragleave','drop'].forEach(ev=>imageDrop.addEventListener(ev,e=>{e.preventDefault();imageDrop.classList.remove('drag');}));
	imageDrop.addEventListener('drop', e=>loadImageFile(e.dataTransfer.files[0]));
