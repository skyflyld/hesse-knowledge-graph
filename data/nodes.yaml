  status: published
  confidence: 高
  evidence_type: handbook (Metzler)
  scope: specific
  description: '首个 Metzler 系列黑塞手册，标志 Hesse 研究进入经典作家行列。编撰纲领: "Hesse anders lesen" — 纳入 Queer Studies、身体文化、跨媒介视角。明确不采用分期框架(14部分按作品/主题/接受组织)。无语言/文体/语法专章。'
  table_of_contents:
    - part: "I: Biographisches — Lebensorte"
      chapters: ["Von Calw nach Tübingen (Schnierle-Lutz)", "Basel (Liebendörfer)", "Gaienhofen/Bern (Hamann)", "Montagnola (Bucher)"]
    - part: "II: Biographisches — Umgebungen"
      chapters: ["Liebesbeziehungen/Familie (Reetz)", "Freunde/Förderer/Vernetzung (Parr)"]
    - part: "III: Das lyrische Werk"
      chapters: ["Hesses Lyrik (Görner)"]
    - part: "IV: Die Erzählungen"
      chapters: ["Erwin (Honold)", "Hermann Lauscher (Esselborn-Krumbiegel)", "Eine Sonate (Burget)", "Kinderseele (Blawid)", "Klein und Wagner (Honold)", "Klingsors letzter Sommer (Kuschel)", "Kurgast (Honold)"]
    - part: "V: Märchen, Legenden, Nachdichtungen, dramatische Versuche"
      chapters: ["Märchen und Legenden (Kragl)", "Textaffine Bilder/malerische Texte (Moser)"]
    - part: "VI: Romane"
      chapters: ["Peter Camenzind (Breuer)", "Unterm Rad (Giuriato)", "Gertrud (Herwig)", "Roßhalde (Herwig)", "Knulp (Singh)", "Demian (Elsaghe)", "Siddhartha (Bauer)", "Steppenwolf (Honold)", "Narziß und Goldmund (Forrester)", "Morgenlandfahrt (Singh)", "Glasperlenspiel (Bartl)"]
    - part: "VII: Essays (Betrachtungen)"
      chapters: ["Hesse als Essayist (Blaschke)", "Hesse als Kritiker/Literaturvermittler (Spindler)", "Hesse als Leser (Solbach)"]
    - part: "VIII: Briefwechsel"
      chapters: ["Briefwerk Überblick (Michels)", "Briefwechsel mit Thomas Mann (Kuschel)", "Briefwechsel mit Stefan Zweig (Magen)", "Briefwechsel mit Söhnen Bruno/Heiner (Limberg)", "Briefwechsel mit Helene Voigt-Diederichs (Villinger)"]
    - part: "IX: Bildende Kunst"
      chapters: ["Auch als Maler ein Dichter (Michels)"]
    - part: "X: Hesses Werk im künstlerischen Kontext"
