# =============================================================================
# 发现概要 (from reference/syntax-evolution-curve.md)
# =============================================================================
key_findings:
  - claim: "Hesse的句法不是从简单走向复杂——31岁时的Camenzind嵌入=4.3(与Steppenwolf持平)"
    severity: critical
    evidence: "Peter Camenzind (1904) embedding=4.3 vs Steppenwolf (1927) embedding=4.4"
  - claim: "Unterm Rad(嵌入=1.7)是主题驱动简化的极端案例，非能力边界"
    severity: critical
    evidence: "同一年份Camenzind已4.3; 差3倍"
  - claim: "每部作品有自己的Satzklammer签名——句长/Mittelfeld/嵌入是三个正交轴"
    severity: critical
    evidence: "5个作品各具独特签名模式"
  - claim: "时间不是Hesse句法的主变量——主题才是"
    severity: critical
    evidence: "1906和1943同在短模式组; 1914和1932同在长模式组"

